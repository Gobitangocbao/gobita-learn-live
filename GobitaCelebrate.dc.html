<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes gbcFall{0%{transform:translateY(-30px) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(150px) rotate(540deg);opacity:.15}}
@keyframes gbcRise{0%{transform:translateY(6px)}100%{transform:translateY(-8px)}}
@keyframes gbcPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
</style>
</helmet>
<div style="position:relative;width:100%;height:150px;overflow:hidden">
  <span style="position:absolute;left:8%;top:0;width:8px;height:13px;background:#F2CE73;border-radius:2px;animation:gbcFall 1.7s linear .0s infinite"></span>
  <span style="position:absolute;left:18%;top:0;width:7px;height:7px;background:#C0685B;border-radius:50%;animation:gbcFall 2.1s linear .5s infinite"></span>
  <span style="position:absolute;left:27%;top:0;width:9px;height:9px;background:#EDE4D8;border-radius:2px;animation:gbcFall 1.5s linear .9s infinite"></span>
  <span style="position:absolute;left:36%;top:0;width:7px;height:12px;background:#E0A24F;border-radius:2px;animation:gbcFall 2.3s linear .2s infinite"></span>
  <span style="position:absolute;left:46%;top:0;width:8px;height:8px;background:#C9A24E;border-radius:50%;animation:gbcFall 1.8s linear 1.1s infinite"></span>
  <span style="position:absolute;left:56%;top:0;width:7px;height:11px;background:#F2CE73;border-radius:2px;animation:gbcFall 2.0s linear .35s infinite"></span>
  <span style="position:absolute;left:64%;top:0;width:9px;height:9px;background:#C0685B;border-radius:2px;animation:gbcFall 1.6s linear .8s infinite"></span>
  <span style="position:absolute;left:73%;top:0;width:7px;height:7px;background:#EDE4D8;border-radius:50%;animation:gbcFall 2.2s linear .15s infinite"></span>
  <span style="position:absolute;left:82%;top:0;width:8px;height:13px;background:#E0A24F;border-radius:2px;animation:gbcFall 1.9s linear 1.0s infinite"></span>
  <span style="position:absolute;left:91%;top:0;width:8px;height:8px;background:#C9A24E;border-radius:50%;animation:gbcFall 1.7s linear .6s infinite"></span>
  <span style="position:absolute;left:13%;top:0;width:7px;height:10px;background:#F2CE73;border-radius:2px;animation:gbcFall 2.4s linear 1.3s infinite"></span>
  <span style="position:absolute;left:88%;top:0;width:7px;height:10px;background:#C0685B;border-radius:2px;animation:gbcFall 2.05s linear 1.5s infinite"></span>

  <div style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:flex-end;gap:7px">
    <div style="display:flex;flex-direction:column;align-items:center">
      <span style="font-size:12px;margin-bottom:2px">🥈</span>
      <div style="width:42px;height:34px;background:linear-gradient(180deg,#C7BBA9,#A99C88);border-radius:5px 5px 2px 2px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-size:12px;font-weight:800;color:#5E5344;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)">2</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;animation:gbcPop .5s cubic-bezier(.2,.9,.25,1.3) both">
      <div style="width:82px;height:86px;animation:gbcRise 1.8s ease-in-out infinite alternate;filter:drop-shadow(0 4px 6px rgba(0,0,0,.28))">
        <dc-import name="GobitaBuddy" outfit="{{ outfit }}" hint-size="82px,86px" style="width:82px;height:86px;display:block"></dc-import>
      </div>
      <div style="width:56px;height:46px;background:linear-gradient(180deg,#F5D989,#C9A24E);border-radius:6px 6px 2px 2px;display:flex;align-items:flex-start;justify-content:center;padding-top:5px;font-size:16px;font-weight:800;color:#5A4212;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)">1</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <span style="font-size:12px;margin-bottom:2px">🥉</span>
      <div style="width:42px;height:26px;background:linear-gradient(180deg,#D69A6A,#B0764A);border-radius:5px 5px 2px 2px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;font-size:12px;font-weight:800;color:#5A3A20;box-shadow:inset 0 2px 0 rgba(255,255,255,.22)">3</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:150},&quot;outfit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;climb&quot;,&quot;race&quot;,&quot;memory&quot;,&quot;blitz&quot;,&quot;mine&quot;,&quot;prompt&quot;],&quot;default&quot;:&quot;climb&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { outfit: this.props.outfit || 'climb' }; }
}
</script>
</body>
</html>
